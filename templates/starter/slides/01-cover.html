<!doctype html>
<html lang="zh-CN">
  <head>
    <style>
      .cover {
        background: #18352c;
        color: #f4f3eb;
      }
      .cover .eyebrow {
        color: #a8c7a5;
      }
      .cover h1 {
        font-size: 105px;
        font-weight: 600;
        line-height: 1.18;
        margin: 120px 0 32px;
        letter-spacing: -4px;
        position: relative;
        z-index: 1;
      }
      .cover .sub {
        font-size: 27px;
        color: #b8cdbf;
        max-width: 740px;
        line-height: 1.8;
      }
      .cover .signature {
        position: absolute;
        left: 78px;
        bottom: 65px;
        display: flex;
        align-items: center;
        gap: 22px;
        font-size: 18px;
        letter-spacing: 2px;
      }
      .cover .signature i {
        width: 52px;
        height: 3px;
        background: #c5fa73;
      }
      .art {
        position: absolute;
        right: 88px;
        top: 135px;
        width: 540px;
        height: 580px;
      }
      .cover .meta {
        position: absolute;
        right: 78px;
        bottom: 64px;
        font-size: 16px;
        color: #a8c7a5;
      }
    </style>
  </head>
  <body>
    <section class="slide cover">
      <span class="eyebrow">CHAOSPPT / ENGINE PREVIEW 01</span>
      <h1 data-element-id="cover-title">
        设计自由<br />交付稳定<span style="color: #c5fa73">。</span>
      </h1>
      <p class="sub">
        用 HTML 构建演示文稿<br />从前端设计，到 PDF 与 PowerPoint
      </p>
      <svg class="art" viewBox="0 0 540 580" aria-label="叠放的幻灯片示意">
        <defs>
          <pattern
            id="dots"
            width="24"
            height="24"
            patternUnits="userSpaceOnUse"
          >
            <circle cx="2" cy="2" r="1" fill="#48705b" />
          </pattern>
        </defs>
        <rect width="540" height="580" fill="url(#dots)" />
        <g transform="translate(50 60) rotate(9 230 190)">
          <rect
            width="430"
            height="290"
            rx="9"
            fill="#3f644e"
            stroke="#80a27b"
          />
          <rect x="24" y="30" width="100" height="6" fill="#a5c0a1" />
        </g>
        <g transform="translate(35 145) rotate(-7 230 190)">
          <rect width="450" height="300" rx="9" fill="#c5fa73" />
          <rect x="30" y="34" width="128" height="9" fill="#18352c" />
          <rect x="30" y="74" width="226" height="6" fill="#729c4a" />
          <path
            d="M35 240 L100 205 L170 220 L240 150 L310 168 L400 104"
            fill="none"
            stroke="#18352c"
            stroke-width="5"
          />
          <circle cx="400" cy="104" r="8" fill="#18352c" />
        </g>
      </svg>
      <div class="signature"><i></i><span>HTML · CSS · JAVASCRIPT</span></div>
      <span class="meta">LOCAL RENDERING / 1600 × 900</span>
    </section>
  </body>
</html>
