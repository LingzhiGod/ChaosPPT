<!doctype html>
<html lang="zh-CN">
  <body>
    <section class="slide" data-pptx-layout="controls">
      <div class="kicker" data-pptx="text" data-pptx-id="kicker">
        CHAOSPPT / EXPLICIT CONTROLS
      </div>
      <h1 data-pptx="text" data-pptx-id="title">按控件设计，按控件编辑</h1>
      <div class="lead" data-pptx="text" data-pptx-id="lead">
        一个文本框承载完整表达，一个编组组织一个组件。
      </div>
      <div class="columns">
        <div class="card" data-pptx-group="text-card">
          <div
            class="card-bg"
            data-pptx="shape"
            data-pptx-id="text-card-bg"
          ></div>
          <div class="card-content" data-pptx-group="text-card-content">
            <div class="badge" data-pptx="text" data-pptx-id="native-badge">
              ONE TEXT CONTROL
            </div>
            <h2 data-pptx="text" data-pptx-id="text-title">段落保持完整</h2>
            <div class="body" data-pptx="text" data-pptx-id="paragraph">
              标题、正文和
              <b>局部加粗</b>
              在同一文本框中编辑。<br />换行保留在框内，不再拆成多个独立对象。
            </div>
            <div class="divider" data-pptx="shape" data-pptx-id="rule"></div>
            <div class="body" data-pptx="text" data-pptx-id="edit-note">
              支持字体、颜色、强调与换行。<br />修改文字时，可以自然重排。
            </div>
          </div>
        </div>
        <div class="card" data-pptx="group" data-pptx-id="group-card">
          <div
            class="card-bg"
            data-pptx="shape"
            data-pptx-id="group-card-bg"
          ></div>
          <div class="card-content" data-pptx-group="group-card-content">
            <div class="badge" data-pptx="text" data-pptx-id="group-badge">
              NATIVE POWERPOINT GROUP
            </div>
            <h2 data-pptx="text" data-pptx-id="group-title">组件真正编组</h2>
            <div class="body" data-pptx="text" data-pptx-id="group-description">
              背景、标题和正文属于同一组件。<br />在 PPT 中整体移动、缩放，<br />或取消组合后分别修改。
            </div>
            <div
              class="divider"
              data-pptx="shape"
              data-pptx-id="group-rule"
            ></div>
            <div class="body" data-pptx="text" data-pptx-id="group-note">
              HTML 定义布局与样式，<br />显式标记定义对象边界。
            </div>
          </div>
        </div>
      </div>
      <div class="footer" data-pptx-group="footer">
        <div data-pptx="text" data-pptx-id="footer-label">
          文本控件 / 形状控件 / 嵌套编组
        </div>
        <div data-pptx="text" data-pptx-id="page">01</div>
      </div>
    </section>
  </body>
</html>
