<!doctype html>
<html lang="zh-CN">
  <body>
    <section class="slide" data-pptx-layout="controls">
      <div class="kicker" data-pptx="text" data-pptx-id="kicker">
        CHAOSPPT / EXPLICIT EXCEPTIONS
      </div>
      <h1 data-pptx="text" data-pptx-id="title">原生优先，例外显式声明</h1>
      <div class="lead" data-pptx="text" data-pptx-id="lead">
        复杂绘制保留画面，普通内容继续保持可编辑。
      </div>
      <div class="columns">
        <div data-pptx-group="chart-component">
          <canvas
            class="chart"
            data-pptx="raster"
            data-pptx-id="curve"
            id="curve"
            width="1400"
            height="600"
          ></canvas>
          <div
            class="raster-label"
            data-pptx="text"
            data-pptx-id="chart-caption"
          >
            Canvas 为一个图片控件，选框贴合内容。
          </div>
        </div>
        <div data-pptx-group="guidance">
          <div class="badge" data-pptx="text" data-pptx-id="badge">
            DECLARE THE BOUNDARY
          </div>
          <h2 data-pptx="text" data-pptx-id="heading">控件边界就是编辑边界</h2>
          <div class="body" data-pptx="text" data-pptx-id="guidance-body">
            文字 → 一个富文本框<br />形状 → 一个原生形状<br />图片 →
            一个独立图片<br />编组 → 一个可取消的组合<br />复杂内容 →
            一个显式图片控件
          </div>
        </div>
      </div>
      <div class="footer" data-pptx-group="footer">
        <div data-pptx="text" data-pptx-id="footer-label">
          布局容器不绘制内容，内容由控件表达。
        </div>
        <div data-pptx="text" data-pptx-id="page">02</div>
      </div>
    </section>
    <script>
      const c = document.getElementById("curve"),
        ctx = c.getContext("2d");
      ctx.fillStyle = "#18352c";
      ctx.fillRect(0, 0, 1400, 600);
      ctx.strokeStyle = "#c5fa73";
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(70, 500);
      ctx.bezierCurveTo(300, 70, 740, 620, 1320, 120);
      ctx.stroke();
      for (const [x, y] of [
        [70, 500],
        [1320, 120],
      ]) {
        ctx.beginPath();
        ctx.arc(x, y, 16, 0, Math.PI * 2);
        ctx.fillStyle = "#c5fa73";
        ctx.fill();
      }
    </script>
  </body>
</html>
