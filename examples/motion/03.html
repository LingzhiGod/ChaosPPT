<!doctype html>
<html lang="zh-CN">
  <body>
    <section class="slide" data-pptx-layout="controls">
      <div
        data-pptx="text"
        data-pptx-id="kicker"
        style="font-size: 20px; color: #d96e42; letter-spacing: 2px"
      >
        03 / MORPH
      </div>
      <h1 data-pptx="text" data-pptx-id="heading">共享组件平滑移动</h1>
      <div

        卡片从左侧移动到右侧，保留同一个共享标识
      </div>
      <div
        data-pptx-group="focus"
        data-pptx-shared="focus-card"
        class="card"
        style="left: 800px; top: 330px; width: 700px; height: 330px"
      >
        <div data-pptx="shape" data-pptx-id="focus-bg" class="card-bg"></div>
        <div
          data-pptx="text"
          data-pptx-id="focus-title"
          style="
            position: absolute;
            left: 28px;
            top: 28px;
            width: 644px;
            font-size: 36px;
            font-weight: 700;
            line-height: 1.35;
          "
        >
          同一个组件
        </div>
        <div
          data-pptx="text"
          data-pptx-id="focus-body"
          style="
            position: absolute;
            left: 28px;
            top: 100px;
            width: 644px;
            font-size: 28px;
            line-height: 1.5;
          "
        >
          相同标识连接两个页面<br />位置和尺寸变化，组件身份不变
        </div>
      </div>
      <div
        data-pptx="text"
        data-pptx-id="hint"
        style="
          position: absolute;
          left: 72px;
          top: 335px;
          width: 600px;
          height: 130px;
          font-size: 36px;
          font-weight: 700;
          line-height: 1.5;
        "
      >
        位置、尺寸与外观<br />在页面之间连续变化
      </div>
      <div
        data-pptx="shape"
        data-pptx-id="shared-bar-0"
        data-pptx-motion='{"effect": "reveal-in", "direction": "left", "durationMs": 700, "trigger": "on-click", "order": 0}'
        style="
          position: absolute;
          left: 72px;
          top: 550px;
          width: 300px;
          height: 35px;
          background: #d96e42;
          border-radius: 4px;
        "
      ></div>
      <div
        data-pptx="shape"
        data-pptx-id="shared-bar-1"
        data-pptx-motion='{"effect": "reveal-in", "direction": "left", "durationMs": 700, "trigger": "after-previous", "order": 1}'
        style="
          position: absolute;
          left: 72px;
          top: 635px;
          width: 470px;
          height: 35px;
          background: #d96e42;
          border-radius: 4px;
        "
      ></div>
      <div data-pptx-group="footer" class="footer">
        <div data-pptx="text" data-pptx-id="footer-note" style="">

        <div data-pptx="text" data-pptx-id="footer-page" style="">3 / 4</div>
