<!doctype html>
<html lang="zh-CN">
  <head>
    <style>
      :root {
        --font-body: "Noto Sans SC", sans-serif;
        --bg: #f4f3eb;
        --fg: #18352c;
        --muted: #617168;
        --safe: 72px;
      }
      .eyebrow {
        text-transform: none;
      }
      h1 {
        font-size: 64px;
        letter-spacing: 0;
        font-weight: 700;
        margin: 18px 0 22px;
      }
      .lead {
        color: #617168;
        font-size: 26px;
      }
      .columns {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 48px;
        margin-top: 48px;
      }
      .card {
        padding: 28px;
        background: #e4ebdc;
        border: 1px solid #acbca5;
        border-radius: 14px;
      }
      .card h2 {
        font-size: 32px;
        line-height: 1.4;
        margin-bottom: 18px;
      }
      .card p {
        font-size: 24px;
        line-height: 1.7;
      }
      .tag {
        display: inline-block;
        padding: 7px 16px;
        background: #18352c;
        color: #f4f3eb;
        border-radius: 8px;
        font-size: 17px;
        margin-bottom: 18px;
      }
      .media {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 28px;
        margin-top: 28px;
      }
      .media img,
      .media canvas {
        width: 100%;
        height: 170px;
        object-fit: cover;
        display: block;
      }
      .label {
        font-size: 18px;
        color: #617168;
        margin-top: 12px;
      }
      .rule {
        height: 2px;
        background: #18352c;
        margin: 34px 0 24px;
      }
      .footer {
        font-family: var(--font-body);
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <section class="slide">
      <span class="eyebrow">CHAOSPPT / EDITABLE EXPORT</span>
      <h1 data-element-id="title">让设计保留编辑能力</h1>
      <p class="lead">同一份 HTML，选择视觉保真，或选择更多原生对象。</p>
      <div class="columns">
        <div class="card" data-element-id="native-card">
          <span class="tag">NATIVE OBJECTS</span>
          <h2>文字与基础形状</h2>
          <p>
            标题、段落和
            <b>加粗文字</b> 保留为文本框。<br />背景、圆角卡片和边框保留为形状。
          </p>
          <div class="rule"></div>
          <p>Flex / Grid 由浏览器排版，<br />导出时使用测量后的固定坐标。</p>
        </div>
        <div>
          <div class="card">
            <span class="tag">LOCAL FALLBACK</span>
            <h2>独立图片与复杂绘制</h2>
            <p>
              普通图片作为独立图片对象。<br />复杂 Canvas
              保留外观，并列入回退报告。
            </p>
          </div>
          <div class="media">
            <div>
              <img src="assets/picture.png" data-element-id="picture" />
              <div class="label">独立图片对象</div>
            </div>
            <div>
              <canvas
                id="plot"
                width="640"
                height="340"
                data-element-id="plot"
              ></canvas>
              <div class="label">Canvas 局部栅格化</div>
            </div>
          </div>
        </div>
      </div>
      <footer class="footer">
        <span>兼容模式 / 可编辑模式 · 不同优先级，明确报告</span><span>01</span>
      </footer>
    </section>
    <script>
      const ctx = document.getElementById("plot").getContext("2d");
      ctx.fillStyle = "#18352c";
      ctx.fillRect(0, 0, 640, 340);
      ctx.strokeStyle = "#c5fa73";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(40, 280);
      ctx.bezierCurveTo(170, 30, 330, 330, 590, 70);
      ctx.stroke();
      for (const [x, y] of [
        [40, 280],
        [590, 70],
      ]) {
        ctx.fillStyle = "#c5fa73";
        ctx.beginPath();
        ctx.arc(x, y, 10, 0, Math.PI * 2);
        ctx.fill();
      }
    </script>
  </body>
</html>
