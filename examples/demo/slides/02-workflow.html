<header class="slide-header"><span class="eyebrow">01 / AUTHORING SYSTEM</span><h1 data-element-id="workflow-title">从完整材料，到完整演示</h1></header>
<p class="lead">内容与设计保留在源文件，浏览器负责计算与呈现。</p>
<div class="steps">
<article class="step"><div class="index">01 — PLAN</div><h2>先组织观点</h2><p>为每页定义标题、核心结论与来源。<br>顺序由大纲决定，而非文件名。</p></article>
<article class="step"><div class="index">02 — DESIGN</div><h2>再构建页面</h2><p>自由使用 Grid、Flex、SVG 与 Canvas。<br>主题与母版保持跨页一致。</p></article>
<article class="step"><div class="index">03 — DELIVER</div><h2>检查后交付</h2><p>等待字体与图表就绪，检查溢出。<br>导出 PDF 与整页图片式 PPTX。</p></article>
</div>
